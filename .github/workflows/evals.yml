name: LLM evals

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      # Fails the build if any model/prompt combination's mean score drops more than
      # 0.05 below the committed baseline. Add API keys as repository secrets to use real models.
      - name: Run evals against baseline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          evalforge run suites/support_summaries.yaml \
            --baseline baselines/support_summaries.json \
            --max-drop 0.05 \
            --report eval-report.html

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.html
