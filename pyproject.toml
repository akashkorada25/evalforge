[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.2.0"
description = "Evaluate and compare LLM prompts and models, and catch quality regressions in CI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
evalforge = "evalforge.cli:main"

[tool.setuptools]
packages = ["evalforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
